<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a2e; color: white; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #0f3460; color: white; border: none; border-radius: 5px; }
        pre { background: #16213e; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 API Test Panel</h1>
    
    <button onclick="testGroq()">Test Groq</button>
    <button onclick="testGemini()">Test Gemini</button>
    <button onclick="testHuggingFace()">Test Hugging Face</button>
    <button onclick="testImageGeneration()">Test Image Generation</button>
    
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        
        async function testGroq() {
            output.innerHTML = 'Testing Groq... 🚀';
            
            try {
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'Hello! Just say hello back.',
                        model: 'groq'
                    })
                });
                
                const data = await response.json();
                output.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                output.innerHTML = `<pre style="color: red;">Error: ${error.message}</pre>`;
            }
        }
        
        async function testGemini() {
            output.innerHTML = 'Testing Gemini... 🚀';
            
            try {
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'Hello!',
                        model: 'gemini'
                    })
                });
                
                const data = await response.json();
                output.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                output.innerHTML = `<pre style="color: red;">Error: ${error.message}</pre>`;
            }
        }
        
        async function testHuggingFace() {
            output.innerHTML = 'Testing Hugging Face (Free)... 🚀';
            
            try {
                const response = await fetch('https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        inputs: 'Hello, how are you?'
                    })
                });
                
                const data = await response.json();
                output.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                output.innerHTML = `<pre style="color: red;">Error: ${error.message}</pre>`;
            }
        }
        
        async function testImageGeneration() {
            output.innerHTML = 'Generating image... 🎨';
            
            const prompt = 'a beautiful sunset over mountains';
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}`;
            
            output.innerHTML = `
                <p>Image URL: <a href="${imageUrl}" target="_blank">${imageUrl}</a></p>
                <img src="${imageUrl}" style="max-width: 500px; border-radius: 10px;">
            `;
        }
    </script>
</body>
</html>
