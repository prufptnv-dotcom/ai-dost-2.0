name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (lint + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage

  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: node --test tests/unit.test.js tests/integration.test.js

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: backend/test-results/
          retention-days: 7

  docker:
    name: Docker (sandbox preview test)
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24-dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start backend server
        run: |
          cd backend
          npm ci
          node server.js &
          sleep 10
          curl -f http://localhost:5000/health
      - name: Test project generation with sandbox
        run: |
          cd backend
          curl -s -N --max-time 180 -X POST http://localhost:5000/api/agent/run \
            -H "Content-Type: application/json" \
            -d '{"userPrompt":"create a simple react app with hello world","forceLocal":true}' \
            --output /tmp/agent-result.txt
          cat /tmp/agent-result.txt
          # Verify sandbox creation works
          if grep -q "sandbox" /tmp/agent-result.txt; then
            echo "Sandbox preview test passed"
          else
            echo "Sandbox preview test failed"
            exit 1
          fi

  deploy:
    name: Deploy Preview
    needs: [frontend, backend, e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (Frontend)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
      - name: Deploy to Railway/Render (Backend)
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          echo "Deploy backend to Railway/Render"
          # Add your deployment script here