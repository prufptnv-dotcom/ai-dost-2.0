name: CI

on:
  push:
    branches:
      - main
      - master
      - 'audit/**'
      - 'feature/**'
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (lint + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage

  backend:
    name: Backend (unit + integration + security + chat-runtime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: node --test tests/unit.test.js tests/integration.test.js tests/security-hardening.test.js tests/projectAuthorization.security.test.js tests/ssrf.security.test.js tests/chatTaskEvents.test.js

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: backend/test-results/
          retention-days: 7

  docker:
    name: Docker (sandbox preview test)
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24-dind
        options: --privileged
