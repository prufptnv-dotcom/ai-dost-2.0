name: CI

on:
  push:
    branches:
      - main
      - master
      - 'audit/**'
      - 'feature/**'
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (lint + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage

  backend:
    name: Backend (unit + integration + security + chat-runtime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - name: Run backend test suite
        run: node --test tests/unit.test.js tests/integration.test.js tests/mcpClientManager.test.js tests/security-hardening.test.js tests/projectAuthorization.security.test.js tests/ssrf.security.test.js tests/chatTaskEvents.test.js tests/taskCancellation.test.js tests/chatTaskAdapter.test.js tests/chatTaskGateway.identity.test.js tests/chatTaskGateway.idempotency.test.js tests/durableTaskIdempotencyStore.test.js tests/startupParity.test.js
      - name: Run Copilot Director runtime tests
        run: node --test agent/runtime/CopilotDirector.test.js
      - name: Run ChatTaskGateway replay tests
        run: node --test agent/runtime/ChatTaskGateway.test.js
      - name: Run ExecutionController timeout tests
        run: node --test agent/runtime/ExecutionController.test.js
      - name: Run DurableTaskStore recovery tests
        run: node --test agent/runtime/DurableTaskStore.test.js
      - name: Run Production Hardening Security Runtime tests
        run: node --test agent/security/ProductionExecutionGuard.test.js agent/security/ProductionHardeningRuntime.test.js agent/security/ProductionRuntimeIntegration.test.js agent/security/ResourceGuard.test.js tests/orchestratorSecurityBoundary.test.js

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # P3 #203: browser + system deps come from postinstall (npm ci) and this
      # idempotent call (--with-deps only adds apt libs when the browser is
      # already present) — no second Chromium download. Cache makes even the
      # first download one-time per lockfile change.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: backend/test-results/
          retention-days: 7

  frontend-browser:
    # P3 #201: frontend/playwright.config.js (tests/browser — real-browser
    # VisualHealer suite) was CI-invisible; only backend Playwright ran.
    name: Frontend (Playwright browser suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-report
          path: frontend/test-results/
          retention-days: 7

  docker:
    name: Docker (compose validation + agent SSE smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files (P3 #200)
        run: |
          docker compose config -q
          docker compose -f memory-brain/docker-compose.yml config -q
      - name: Validate Dockerfiles (P3 #200)
        run: |
          docker buildx build --check ./backend
          docker buildx build --check ./frontend
          docker buildx build --check ./ai-engine
          docker buildx build --check ./memory-brain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start backend server
        run: |
          cd backend
          npm ci
          node -r ./security-hardening.js -r ./taskCancellation.js -r ./chatAgentRouteBridge.js server.js &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1; then
              echo "Backend healthy after ~${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend failed to become healthy within 30s"
              exit 1
            fi
            sleep 1
          done
      - name: Test agent SSE stream terminates properly
        run: |
          cd backend
          curl -s -N --max-time 180 -X POST http://localhost:5000/api/agent/run \
            -H "Content-Type: application/json" \
            -d '{"userPrompt":"create a simple react app with hello world","forceLocal":true}' \
            --output /tmp/agent-result.txt || true
          # routes/agent.js always terminates the run endpoint's SSE stream with
          # send({ type: 'done' }) (JSON: {"type":"done"}) followed by res.end().
          if grep -q '"type":"done"' /tmp/agent-result.txt; then
            echo "Agent SSE stream terminated with terminal done event"
          else
            echo "Agent SSE stream did not terminate with a done event"
            tail -c 2000 /tmp/agent-result.txt || true
            exit 1
          fi

  deploy:
    name: Deploy Preview
    needs: [frontend, backend, e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # secrets context is available in job-level env (not in steps.if) —
    # evaluate once here, then gate each deploy step on the env flag.
    # P3 #215: gate on ALL required secrets — a missing ORG/PROJECT id used to
    # turn a half-configured setup into a red deploy job on main.
    env:
      VERCEL_TOKEN_SET: ${{ secrets.VERCEL_TOKEN != '' }}
      VERCEL_ORG_ID_SET: ${{ secrets.VERCEL_ORG_ID != '' }}
      VERCEL_PROJECT_ID_SET: ${{ secrets.VERCEL_PROJECT_ID != '' }}
      RAILWAY_TOKEN_SET: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (Frontend)
        if: env.VERCEL_TOKEN_SET == 'true' && env.VERCEL_ORG_ID_SET == 'true' && env.VERCEL_PROJECT_ID_SET == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{secrets.VERCEL_TOKEN}}
          vercel-org-id: ${{secrets.VERCEL_ORG_ID}}
          vercel-project-id: ${{secrets.VERCEL_PROJECT_ID}}
          working-directory: frontend
      - name: Deploy to Railway/Render (Backend)
        if: env.RAILWAY_TOKEN_SET == 'true'
        run: |
          echo "Deploy backend to Railway/Render"
          # Add your deployment script here
