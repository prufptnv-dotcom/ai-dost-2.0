name: Ai-Dost CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r memory-brain/requirements.txt

      - name: Run tests
        env:
          MONGODB_URL: mongodb://root:example@localhost:27017
          DATABASE_NAME: ai_dost_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd memory-brain
          python -m pytest -v
