# P3 #214: this workflow only RUNS TESTS (no deploy) and used to fire on the
# exact same push/pull_request: main events as ci.yml — double runner minutes
# per push. Kept as a manual/extended suite (memory-brain + runtime tests).
name: Ai-Dost extended tests (manual)

on:
  workflow_dispatch:
  schedule:
    # weekly full run (memory-brain install is multi-GB, don't do it per push)
    - cron: '0 4 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Node runtime tests
        run: node --test backend/agent/runtime/CopilotDirector.test.js

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          # P3 #205: cache pip — memory-brain/requirements.txt pulls
          # torch/sentence-transformers/chromadb (multi-GB) every run.
          cache: pip
          cache-dependency-path: memory-brain/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r memory-brain/requirements.txt

      - name: Run Python tests
        env:
          MONGODB_URL: mongodb://root:example@127.0.0.1:27017
          DATABASE_NAME: ai_dost_test
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          cd memory-brain
          python -m pytest -v
