name: Targeted dependency remediation

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/dependency-remediation.yml'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/next.config.mjs'
  push:
    branches:
      - fix/forge-studio-primary-runtime-2026-10
    paths:
      - '.github/workflows/dependency-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    name: Update vulnerable dependencies safely
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/forge-studio-primary-runtime-2026-10
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Remove unused and vulnerable dependency chains
        run: |
          cd backend
          # Replace nodemon with Node 22's built-in watch mode and fix ExcelJS's vulnerable nested UUID dependency.
          npm pkg delete 'devDependencies.nodemon'
          npm pkg set 'scripts.dev=node --watch -r ./security-hardening.js -r ./taskCancellation.js -r ./chatAgentRouteBridge.js server.js' 'overrides.exceljs.uuid=^11.1.1'
          cd ../frontend
          # These language-client and PWA packages have no source imports; the app uses Monaco React/y-monaco and registers its own public/sw.js.
          npm pkg delete 'dependencies.@ducanh2912/next-pwa'
          npm pkg delete 'dependencies.monaco-languageclient'
          npm pkg delete 'dependencies.vscode-ws-jsonrpc'
          # Keep the custom flat config out of the vulnerable Next lint preset chain.
          # ESLint 9 stays inside all selected React/a11y plugin peer ranges.
          npm pkg delete 'devDependencies.eslint-config-next'
          npm pkg set 'dependencies.next=16.4.0' 'dependencies.axios=^1.20.0' 'dependencies.sharp=^0.35.5' 'dependencies.dompurify=^3.4.16' 'devDependencies.eslint=^9.39.5' 'devDependencies.@eslint/js=^9.39.5' 'devDependencies.eslint-plugin-react=^7.37.5' 'devDependencies.eslint-plugin-react-hooks=^7.1.1' 'devDependencies.eslint-plugin-jsx-a11y=^6.10.2' 'devDependencies.globals=^16.4.0' 'overrides.dompurify=^3.4.16' 'overrides.monaco-editor.dompurify=^3.4.16'
          # Drop the force-disabled PWA wrapper. The app explicitly registers its maintained public/sw.js in pages/_app.js.
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'next.config.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const loader = /async function loadPWA\(\) \{[\s\S]*?\n\}\n\n(?=const nextConfig)/;
          const endExport = 'export default loadPWA().then(withPWA => withPWA(nextConfig));';
          const isAlreadyClean = !source.includes('loadPWA')
            && !source.includes('@ducanh2912/next-pwa')
            && source.includes('export default nextConfig;');
          if (isAlreadyClean) {
            console.log('Next PWA wrapper already removed; nothing to do.');
          } else {
            if (!loader.test(source) || !source.includes(endExport)) {
              throw new Error('Next PWA removal anchors changed; refusing to edit config blindly.');
            }
            source = source.replace(loader, '');
            source = source.replace(endExport, 'export default nextConfig;');
            if (source.includes('loadPWA') || source.includes('@ducanh2912/next-pwa')) {
              throw new Error('Next PWA references remain after attempted removal.');
            }
            fs.writeFileSync(file, source);
            console.log('Removed disabled PWA plugin; kept the explicit public/sw.js registration.');
          }
          NODE
      - name: Regenerate lockfiles and apply non-breaking audit fixes
        run: |
          (cd backend && npm install --package-lock-only --ignore-scripts && npm audit fix || true)
          (cd frontend && npm install --package-lock-only --ignore-scripts && npm audit fix || true)
      - name: Validate backend install and tests
        working-directory: backend
        run: |
          npm ci
          node --check server.js
          node --test --test-force-exit tests/unit.test.js tests/integration.test.js tests/mcpClientManager.test.js tests/security-hardening.test.js tests/projectAuthorization.security.test.js tests/ssrf.security.test.js tests/chatTaskEvents.test.js tests/taskCancellation.test.js tests/chatTaskAdapter.test.js tests/chatTaskGateway.identity.test.js tests/chatTaskGateway.idempotency.test.js tests/durableTaskIdempotencyStore.test.js tests/startupParity.test.js tests/codeDiffHardening.test.js
          node --test agent/runtime/CopilotDirector.test.js
          node --test agent/runtime/ChatTaskGateway.test.js
          node --test agent/runtime/ExecutionController.test.js
          node --test agent/runtime/DurableTaskStore.test.js
          node --test agent/security/ProductionExecutionGuard.test.js agent/security/ProductionHardeningRuntime.test.js agent/security/ProductionRuntimeIntegration.test.js agent/security/ResourceGuard.test.js tests/orchestratorSecurityBoundary.test.js
      - name: Validate frontend install, lint, and unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --coverage --runInBand
          npm run build
      - name: Recheck dependency audit
        run: |
          (cd backend && npm audit --json > ../backend-npm-audit-after.json || true)
          (cd frontend && npm audit --json > ../frontend-npm-audit-after.json || true)
      - name: Upload post-remediation audit reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-audit-after-remediation
          path: '*-npm-audit-after.json'
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit tested dependency manifests and lockfiles
        run: |
          if git diff --quiet -- backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json frontend/next.config.mjs; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The remediation step also removes the disabled PWA wrapper from next.config.mjs.
          # Commit that configuration together with the manifests so clean CI installs work.
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json frontend/next.config.mjs
          git commit -m "security: apply targeted dependency fixes"
          git push origin HEAD:fix/forge-studio-primary-runtime-2026-10
