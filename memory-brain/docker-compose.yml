services:
  api:
    build: .
    ports:
      # P0 FIX (#175): container listens on ${PORT:-5005} (see Dockerfile CMD /
      # EXPOSE 5005). The old "5002:5000" mapped host 5002 onto a DEAD port.
      - "5002:5005"
    environment:
      - MONGODB_URL=mongodb://root:${MONGO_ROOT_PASSWORD:-ai_dost_local_mongo_pw}@mongo:27017
      - DATABASE_NAME=ai_dost_memory
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change_me_redis}@redis:6379
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change_me_redis}
      # #180: JWT signing secret — defaults to ephemeral dev key if unset
      - SECRET_KEY=${SECRET_KEY:-}
    depends_on:
      - mongo
      - redis
      - chromadb
    restart: on-failure

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-ai_dost_local_mongo_pw}
    volumes:
      - mongo-data:/data/db
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change_me_redis}
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me_redis}
    volumes:
      - redis-data:/data
    restart: on-failure

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/data
    restart: on-failure

volumes:
  mongo-data:
  redis-data:
  chroma-data:
