<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 2 — Host with Preview Iframe (loop scope)</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    .host-content {
      padding: 10px;
      background: #f0f0f0;
      margin-bottom: 20px;
      border: 2px solid #999;
    }
    .broken-host-element {
      width: 9999px;
      height: 20px;
      background: red;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: 2px solid #333;
    }
  </style>
</head>
<body>
  <div class="host-content">
    <h1>Host Application</h1>
    <p>Host has its own broken element. The healing loop runs against the IFRAME only:</p>
    <div class="broken-host-element" id="host-broken">Host broken element (must stay untouched)</div>
  </div>
  <h2>Preview Iframe (healing target):</h2>
  <iframe id="preview-frame" src="heal-safe.html"></iframe>
</body>
</html>
