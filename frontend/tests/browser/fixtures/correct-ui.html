<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixture F — Correct UI (False Positive Check)</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .aria-hidden-section {
      aria-hidden: true;
    }
    .tooltip {
      position: relative;
      display: inline-block;
    }
    .tooltip:hover .tooltip-text {
      visibility: visible;
    }
    .tooltip-text {
      visibility: hidden;
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .nested-text {
      position: relative;
    }
    .nested-text span {
      display: block;
    }
  </style>
</head>
<body>
  <p>This page has correct UI that should NOT trigger false positives:</p>

  <!-- Modal dialog -->
  <div class="modal-overlay">
    <div class="modal" role="dialog">
      <h2>Modal Title</h2>
      <p>Modal content here</p>
      <button>Close</button>
    </div>
  </div>

  <!-- Tooltip -->
  <div class="tooltip">
    Hover me
    <span class="tooltip-text">Tooltip text</span>
  </div>

  <!-- Nested text (should not be flagged as overlap) -->
  <div class="nested-text">
    <p>Parent paragraph</p>
    <span>Child span inside parent</span>
  </div>

  <!-- aria-hidden section -->
  <div aria-hidden="true">
    <p>This content is aria-hidden and should be ignored</p>
  </div>
</body>
</html>
