<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 2 Case A — Single Safe Fix</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; }
    .container { width: 100%; border: 2px solid #333; padding: 10px; }
    .wide-element {
      width: 2000px;
      height: 50px;
      background: #ff6b6b;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <p>Single independent viewport overflow — should be auto-fixed via safe clamp.</p>
    <div class="wide-element">I am 2000px wide and should be clamped by the safe fix</div>
  </div>
</body>
</html>
