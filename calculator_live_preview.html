<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Dost Agent — Calculator Live Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #05060a;
      color: #06b6d4;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }
    .header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .calculator {
      width: 320px;
      padding: 24px;
      border-radius: 24px;
      background: rgba(14, 16, 24, 0.85);
      border: 1px solid rgba(6, 182, 212, 0.25);
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.15), inset 0 0 20px rgba(255,255,255,0.02);
      backdrop-filter: blur(12px);
    }
    .display-container {
      margin-bottom: 20px;
    }
    #display {
      width: 100%;
      height: 60px;
      font-size: 28px;
      font-weight: 600;
      text-align: right;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(5, 6, 10, 0.95);
      color: #06b6d4;
      padding: 0 16px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
      outline: none;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .button {
      height: 56px;
      font-size: 18px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .button:hover {
      background: rgba(6, 182, 212, 0.18);
      border-color: rgba(6, 182, 212, 0.4);
      color: #06b6d4;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
      transform: translateY(-1px);
    }
    .button:active {
      transform: translateY(1px);
    }
    .button.operator {
      color: #06b6d4;
      background: rgba(6, 182, 212, 0.08);
    }
    .button.action {
      color: #f43f5e;
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.2);
    }
    .button.action:hover {
      background: rgba(244, 63, 94, 0.25);
      color: #fff;
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
    }
    .button.equals {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #05060a;
      font-weight: 700;
      border: none;
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.4);
    }
    .button.equals:hover {
      background: linear-gradient(135deg, #22d3ee, #60a5fa);
      color: #000;
      box-shadow: 0 0 24px rgba(6, 182, 212, 0.6);
    }
    .badge {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      color: #06b6d4;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🤖 AI-Dost Autonomous Agent — Live Calculator UI</h1>
    <p>Autonomously Generated Project Files (HTML5 + CSS3 + Python Engine)</p>
  </div>

  <div class="calculator">
    <div class="display-container">
      <input type="text" id="display" readonly placeholder="0">
    </div>

    <div class="buttons">
      <button class="button action" onclick="clearDisplay()">C</button>
      <button class="button action" onclick="deleteChar()">DEL</button>
      <button class="button operator" onclick="appendChar('%')">%</button>
      <button class="button operator" onclick="appendChar('/')">÷</button>

      <button class="button" onclick="appendChar('7')">7</button>
      <button class="button" onclick="appendChar('8')">8</button>
      <button class="button" onclick="appendChar('9')">9</button>
      <button class="button operator" onclick="appendChar('*')">×</button>

      <button class="button" onclick="appendChar('4')">4</button>
      <button class="button" onclick="appendChar('5')">5</button>
      <button class="button" onclick="appendChar('6')">6</button>
      <button class="button operator" onclick="appendChar('-')">-</button>

      <button class="button" onclick="appendChar('1')">1</button>
      <button class="button" onclick="appendChar('2')">2</button>
      <button class="button" onclick="appendChar('3')">3</button>
      <button class="button operator" onclick="appendChar('+')">+</button>

      <button class="button" onclick="appendChar('0')">0</button>
      <button class="button" onclick="appendChar('00')">00</button>
      <button class="button" onclick="appendChar('.')">.</button>
      <button class="button equals" onclick="calculate()">=</button>
    </div>
  </div>

  <div class="badge">
    ⚡ Built 100% Autonomously by AI-Dost ReAct Engine
  </div>

  <script>
    const display = document.getElementById('display');

    function clearDisplay() {
      display.value = '';
    }

    function deleteChar() {
      display.value = display.value.slice(0, -1);
    }

    function appendChar(char) {
      if (display.value === '0' && char !== '.') {
        display.value = char;
      } else {
        display.value += char;
      }
    }

    function calculate() {
      if (!display.value) return;
      try {
        let expr = display.value.replace(/×/g, '*').replace(/÷/g, '/');
        let result = Function('"use strict";return (' + expr + ')')();
        display.value = Number.isInteger(result) ? result : parseFloat(result.toFixed(6));
      } catch (e) {
        display.value = 'Error';
        setTimeout(() => { display.value = ''; }, 1500);
      }
    }
  </script>
</body>
</html>
